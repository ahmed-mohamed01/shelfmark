# Fork-only: build the Elscione branch under a stable tag, so the server can follow
# `:elscione` instead of a new `sha-*` tag per build. Upstream does not have this file.
name: Build Elscione image
on:
  push:
    branches: ['claude/elscione-source-195a12']
  workflow_dispatch:
permissions: read-all

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/shelfmark

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Short commit id
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: shelfmark
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_VERSION=elscione-${{ steps.sha.outputs.short }}
            RELEASE_VERSION=elscione
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:elscione
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:elscione-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=elscione
          cache-to: type=gha,scope=elscione
